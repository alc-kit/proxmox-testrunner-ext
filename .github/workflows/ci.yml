name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  # the testrunner this repository is tested against: a COMMIT, bumped deliberately
  TESTRUNNER_REF: 9bc516744826020d0896c3178db0101740f673e7
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: alc-kit/testrunner
          ref: ${{ env.TESTRUNNER_REF }}
          path: testrunner
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pyyaml==6.0.3 pytest==9.1.1
      - run: python -m pytest -q tests
        env:
          TESTRUNNER_SRC: testrunner/src
  content-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # the names this public repository must never contain are a SECRET (writing them here would
      # publish them); --require-names fails the job when the secret is missing
      - run: tools/content-guard --require-names
        env:
          CONTENT_GUARD_NAMES: ${{ secrets.CONTENT_GUARD_NAMES }}
